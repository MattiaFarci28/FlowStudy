[project]
name = "flowstudy"
version = "0.1.0"
description = "Timer di studio con pause proporzionali al tempo studiato, sessioni per materia e statistiche."
requires-python = ">=3.12"

[tool.pytest.ini_options]
# Aggiunge la radice del progetto a sys.path: senza questo,
# "from src.domain import ..." nei test fallirebbe con ModuleNotFoundError.
pythonpath = ["."]
testpaths = ["tests"]
# I test di integrazione (database, API) si possono lanciare a parte:
#   pytest -m integrazione        solo quelli
#   pytest -m "not integrazione"  solo i test di unita'
markers = [
    "integrazione: test che coinvolgono database e API insieme al dominio",
    "container: test sul container in esecuzione (richiedono FLOWSTUDY_URL)",
]
# Un marcatore scritto male deve dare errore, non passare inosservato.
addopts = "--strict-markers"

# --- Copertura ---------------------------------------------------------------
#   pytest --cov                    tabella nel terminale
#   pytest --cov --cov-report=html  pagina navigabile in htmlcov/index.html

[tool.coverage.run]
source = ["src"]
# Misura anche i rami: ogni if deve essere percorso sia nel caso vero sia
# in quello falso, non basta che la riga venga eseguita.
branch = true

[tool.coverage.report]
show_missing = true
# Sotto questa soglia la misura fallisce, e con lei la pipeline. Oggi la
# copertura e' al 100%: il margine serve a non bloccare il lavoro per una
# riga difensiva, non ad abbassare l'asticella.
fail_under = 95

# --- Analisi statica ---------------------------------------------------------
#   ruff check            segnala i problemi
#   ruff check --fix      corregge quelli sistemabili in automatico

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E", "W",   # stile PEP 8 (pycodestyle)
    "F",        # errori certi: import inutili, nomi non definiti (pyflakes)
    "I",        # ordine degli import
    "B",        # costrutti che nascondono bug (bugbear)
    "UP",       # sintassi moderna per Python 3.12 (pyupgrade)
    "SIM",      # codice semplificabile
    "C4",       # comprensioni scritte bene
]
